<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | Hospital Management System'">Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/hospital.css}" rel="stylesheet">
</head>
<body>

<div th:fragment="sidebar(activePage)" class="hms-sidebar">
    <div class="hms-brand">
        <img th:src="@{/images/hospital-logo.svg}" alt="Hospital Logo">
        <div>
            <div class="hms-brand-title">MedCore HMS</div>
            <div class="hms-brand-sub">Hospital Administration</div>
        </div>
    </div>

    <nav class="nav flex-column hms-nav">
        <a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'" th:href="@{/dashboard}">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
        </a>
        <a class="nav-link" th:classappend="${activePage == 'patients'} ? 'active'" th:href="@{/patients}">
            <i class="bi bi-people-fill"></i>
            <span>Patient Management</span>
        </a>
        <a class="nav-link" th:classappend="${activePage == 'doctors'} ? 'active'" th:href="@{/doctors}">
            <i class="bi bi-person-badge-fill"></i>
            <span>Doctor Management</span>
        </a>
        <a class="nav-link" th:classappend="${activePage == 'appointments'} ? 'active'" th:href="@{/appointments}">
            <i class="bi bi-calendar2-check-fill"></i>
            <span>Appointment Management</span>
        </a>
        <a class="nav-link" th:classappend="${activePage == 'medical-records'} ? 'active'" th:href="@{/medical-records}">
            <i class="bi bi-file-earmark-medical-fill"></i>
            <span>Medical Records</span>
        </a>
    </nav>

    <div class="hms-sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light w-100 d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </button>
        </form>
    </div>
</div>

<header th:fragment="topbar(headerTitle)" class="hms-topbar">
    <div>
        <h5 class="mb-0 fw-bold text-primary" th:text="${headerTitle}">Dashboard</h5>
    </div>
    <div class="d-flex align-items-center gap-3">
        <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2">
            <i class="bi bi-shield-lock-fill me-1"></i>
            <span sec:authentication="name">admin</span>
        </span>
    </div>
</header>

<div th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<div th:fragment="confirmModal">
    <div class="modal fade" id="hmsConfirmModal" tabindex="-1" aria-labelledby="hmsConfirmTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="hmsConfirmTitle">
                        <i class="bi bi-exclamation-octagon-fill me-2"></i>Confirm Action
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="hmsConfirmMessage" class="mb-0">Are you sure you want to proceed?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
                    <form id="hmsConfirmForm" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-danger">Confirm</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/hospital.js}"></script>
</th:block>

</body>
</html>
