<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Edit Doctor' : 'Add Doctor')}"></head>
<body>

<div class="hms-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('doctors')}"></div>

    <div class="hms-main">
        <div th:replace="~{fragments/layout :: topbar(${isEdit} ? 'Update Doctor Information' : 'Doctor Registration')}"></div>

        <main class="hms-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="hms-card p-4 mx-auto" style="max-width: 820px;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h5 class="fw-bold text-primary mb-1" th:text="${isEdit} ? 'Edit Doctor Profile' : 'Add New Doctor'"></h5>
                        <p class="text-muted small mb-0" th:if="${!isEdit}">Doctor ID will be generated automatically.</p>
                        <p class="text-muted small mb-0" th:if="${isEdit}">
                            Doctor ID: <span class="hms-code-badge" th:text="${doctor.doctorCode}"></span>
                        </p>
                    </div>
                    <a th:href="@{/doctors}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Back to List
                    </a>
                </div>

                <form th:action="${isEdit} ? @{/doctors/{id}/update(id=${doctor.id})} : @{/doctors/save}"
                      th:object="${doctor}" method="post" class="needs-validation" novalidate>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="fullName" class="form-label fw-semibold">Doctor Name *</label>
                            <input type="text" id="fullName" th:field="*{fullName}" placeholder="e.g. Dr. Vikram Sethi"
                                   class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{fullName}">Doctor name is required.</div>
                        </div>

                        <div class="col-md-6">
                            <label for="specialization" class="form-label fw-semibold">Specialization *</label>
                            <input type="text" id="specialization" th:field="*{specialization}" placeholder="e.g. Cardiology"
                                   class="form-control" th:classappend="${#fields.hasErrors('specialization')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{specialization}">Specialization is required.</div>
                        </div>

                        <div class="col-md-6">
                            <label for="qualification" class="form-label fw-semibold">Qualification *</label>
                            <input type="text" id="qualification" th:field="*{qualification}" placeholder="e.g. MBBS, MD"
                                   class="form-control" th:classappend="${#fields.hasErrors('qualification')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{qualification}">Qualification is required.</div>
                        </div>

                        <div class="col-md-6">
                            <label for="department" class="form-label fw-semibold">Department *</label>
                            <input type="text" id="department" th:field="*{department}" placeholder="e.g. Cardiology Department"
                                   class="form-control" th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{department}">Department is required.</div>
                        </div>

                        <div class="col-md-4">
                            <label for="phoneNumber" class="form-label fw-semibold">Phone Number *</label>
                            <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" pattern="^[+]?[0-9]{10,15}$"
                                   class="form-control" th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{phoneNumber}">Valid 10-15 digit phone number required.</div>
                        </div>

                        <div class="col-md-4">
                            <label for="email" class="form-label fw-semibold">Email Address *</label>
                            <input type="email" id="email" th:field="*{email}"
                                   class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{email}">Valid email address is required.</div>
                        </div>

                        <div class="col-md-4">
                            <label for="availabilityStatus" class="form-label fw-semibold">Availability Status *</label>
                            <select id="availabilityStatus" th:field="*{availabilityStatus}" class="form-select" required>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-4 d-flex justify-content-end gap-2">
                        <a th:href="@{/doctors}" class="btn btn-light border">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save-fill me-2"></i>
                            <span th:text="${isEdit} ? 'Update Doctor' : 'Save Doctor'">Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
