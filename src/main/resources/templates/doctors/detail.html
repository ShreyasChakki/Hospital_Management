<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Doctor Details')}"></head>
<body>

<div class="hms-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('doctors')}"></div>

    <div class="hms-main">
        <div th:replace="~{fragments/layout :: topbar('Doctor Profile')}"></div>

        <main class="hms-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="hms-card p-4 mx-auto" style="max-width: 820px;">
                <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4 pb-3 border-bottom">
                    <div>
                        <span class="hms-code-badge mb-2 d-inline-block" th:text="${doctor.doctorCode}"></span>
                        <h4 class="fw-bold mb-1" th:text="${doctor.fullName}"></h4>
                        <span class="text-primary fw-medium" th:text="${doctor.specialization} + ' • ' + ${doctor.department}"></span>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:if="${doctor.availabilityStatus.name() == 'AVAILABLE'}"
                           th:href="@{/appointments/new(doctorId=${doctor.id})}" class="btn btn-primary btn-sm">
                            <i class="bi bi-calendar-plus me-1"></i>Schedule Appointment
                        </a>
                        <a th:href="@{/doctors/{id}/edit(id=${doctor.id})}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-pencil me-1"></i>Edit
                        </a>
                        <button type="button" class="btn btn-outline-danger btn-sm"
                                th:attr="data-confirm-action=@{/doctors/{id}/delete(id=${doctor.id})},data-confirm-message='Delete doctor ' + ${doctor.fullName} + '?'">
                            <i class="bi bi-trash me-1"></i>Delete
                        </button>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="text-muted small">Qualification</div>
                        <div class="fw-semibold" th:text="${doctor.qualification}"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="text-muted small">Availability Status</div>
                        <div>
                            <span class="badge"
                                  th:classappend="${doctor.availabilityStatus.name() == 'AVAILABLE'} ? 'bg-success' : (${doctor.availabilityStatus.name() == 'ON_LEAVE'} ? 'bg-warning text-dark' : 'bg-secondary')"
                                  th:text="${doctor.availabilityStatus.displayName}"></span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="text-muted small">Phone Number</div>
                        <div class="fw-semibold" th:text="${doctor.phoneNumber}"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="text-muted small">Email Address</div>
                        <div class="fw-semibold" th:text="${doctor.email}"></div>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top">
                    <a th:href="@{/doctors}" class="btn btn-light border btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Back to Doctors
                    </a>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/layout :: confirmModal}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
