<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/hospital.css}" rel="stylesheet">
</head>
<body class="hms-login-body">

<div class="hms-login-card">
    <div class="hms-login-header">
        <img th:src="@{/images/hospital-logo.svg}" alt="MedCore HMS" width="52" height="52" class="mb-2">
        <h4 class="fw-bold mb-1">MedCore Hospital Management</h4>
        <p class="mb-0 small opacity-75">Authorized Administrator Portal</p>
    </div>

    <div class="p-4 p-md-5">
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-circle-fill me-2"></i>
            <span th:text="${errorMessage}">Invalid credentials</span>
        </div>

        <div th:if="${logoutMessage}" class="alert alert-success d-flex align-items-center" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${logoutMessage}">Logged out</span>
        </div>

        <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person-fill text-primary"></i></span>
                    <input type="text" id="username" name="username" class="form-control"
                           placeholder="Enter administrator username" required autofocus>
                    <div class="invalid-feedback">Please enter your username.</div>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock-fill text-primary"></i></span>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Enter password" required>
                    <div class="invalid-feedback">Please enter your password.</div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Dashboard
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center small text-muted">
            Protected by Spring Security &amp; BCrypt encryption.
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/hospital.js}"></script>
</body>
</html>
