<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="hms-card p-5 text-center" style="max-width: 540px; width: 100%;">
    <div class="text-primary mb-3">
        <i class="bi bi-exclamation-triangle-fill" style="font-size: 3rem;"></i>
    </div>
    <h2 class="fw-bold mb-2" th:text="${errorTitle != null ? errorTitle : 'Request Could Not Be Completed'}">Error</h2>
    <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred. Please check your input and try again.'}"></p>
    <div class="d-flex justify-content-center gap-2">
        <a th:href="@{/dashboard}" class="btn btn-primary">
            <i class="bi bi-house-door-fill me-1"></i>Go to Dashboard
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">Go Back</a>
    </div>
</div>

</body>
</html>
