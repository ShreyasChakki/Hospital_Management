<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Medical Records')}"></head>
<body>

<div class="hms-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('medical-records')}"></div>

    <div class="hms-main">
        <div th:replace="~{fragments/layout :: topbar('Patient Medical Record Management')}"></div>

        <main class="hms-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="alert alert-info border-info-subtle d-flex align-items-center gap-2 small mb-4">
                <i class="bi bi-shield-check fs-5"></i>
                <span>Confidential Clinical Section: Demonstration records are explicitly badged as <strong>DEMO DATA</strong> to separate academic test cases from real patient records.</span>
            </div>

            <div class="hms-card p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                    <form th:action="@{/medical-records}" method="get" class="d-flex gap-2 flex-grow-1" style="max-width: 520px;">
                        <input type="text" name="query" th:value="${query}" class="form-control"
                               placeholder="Search by Patient ID, Patient Name, Record ID, or Diagnosis...">
                        <button type="submit" class="btn btn-outline-primary">
                            <i class="bi bi-search"></i> Search
                        </button>
                        <a th:if="${query != null and !query.isEmpty()}" th:href="@{/medical-records}" class="btn btn-light border">Reset</a>
                    </form>

                    <a th:href="@{/medical-records/new}" class="btn btn-primary">
                        <i class="bi bi-file-earmark-plus-fill me-2"></i>Add Medical Record
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle hms-table mb-0">
                        <thead>
                        <tr>
                            <th>Record ID</th>
                            <th>Patient</th>
                            <th>Doctor</th>
                            <th>Visit Date</th>
                            <th>Diagnosis</th>
                            <th>Data Type</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(records)}">
                            <td colspan="7" class="text-center text-muted py-4">No medical records found.</td>
                        </tr>
                        <tr th:each="r : ${records}">
                            <td><span class="hms-code-badge" th:text="${r.recordCode}"></span></td>
                            <td>
                                <a th:href="@{/medical-records/patient/{id}(id=${r.patientId})}" class="fw-semibold text-decoration-none" th:text="${r.patientName}"></a>
                                <div class="small text-muted" th:text="${r.patientCode}"></div>
                            </td>
                            <td th:text="${r.doctorName}"></td>
                            <td th:text="${r.visitDate}"></td>
                            <td th:text="${r.diagnosis}"></td>
                            <td>
                                <span th:if="${r.demoData}" class="badge bg-warning text-dark">DEMO DATA</span>
                                <span th:unless="${r.demoData}" class="badge bg-primary-subtle text-primary border border-primary-subtle">CLINICAL</span>
                            </td>
                            <td class="text-end">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/medical-records/patient/{id}(id=${r.patientId})}" class="btn btn-outline-primary" title="Full Patient History">
                                        <i class="bi bi-clock-history"></i> History
                                    </a>
                                    <a th:href="@{/medical-records/{id}/edit(id=${r.id})}" class="btn btn-outline-secondary" title="Update Record">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
