<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Patient Medical History')}"></head>
<body>

<div class="hms-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('medical-records')}"></div>

    <div class="hms-main">
        <div th:replace="~{fragments/layout :: topbar('Patient Medical History')}"></div>

        <main class="hms-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Patient Summary Header -->
            <div class="hms-card p-4 mb-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                    <div>
                        <span class="hms-code-badge mb-2 d-inline-block" th:text="${patient.patientCode}"></span>
                        <h4 class="fw-bold mb-1" th:text="${patient.fullName}"></h4>
                        <div class="text-muted small">
                            <span th:text="${patient.age} + ' yrs • ' + ${patient.gender} + ' • Blood Group: ' + ${patient.bloodGroup}"></span>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/medical-records/new(patientId=${patient.id})}" class="btn btn-primary btn-sm">
                            <i class="bi bi-plus-circle-fill me-1"></i>Add New Record
                        </a>
                        <a th:href="@{/patients/{id}(id=${patient.id})}" class="btn btn-outline-primary btn-sm">
                            Patient Profile
                        </a>
                        <a th:href="@{/medical-records}" class="btn btn-light border btn-sm">All Records</a>
                    </div>
                </div>
            </div>

            <!-- Chronological Medical Records -->
            <div th:if="${#lists.isEmpty(history)}" class="hms-card p-5 text-center text-muted">
                <i class="bi bi-journal-x fs-1 text-primary mb-2 d-block"></i>
                <p class="mb-3">No medical records have been recorded for this patient yet.</p>
                <a th:href="@{/medical-records/new(patientId=${patient.id})}" class="btn btn-primary btn-sm">
                    Create First Medical Record
                </a>
            </div>

            <div class="d-flex flex-column gap-3">
                <div th:each="r : ${history}" class="hms-card p-4">
                    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3 pb-2 border-bottom">
                        <div>
                            <span class="hms-code-badge me-2" th:text="${r.recordCode}"></span>
                            <span th:if="${r.demoData}" class="badge bg-warning text-dark me-2">DEMO DATA</span>
                            <span class="fw-bold fs-5 text-primary" th:text="${r.diagnosis}"></span>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="text-muted small" th:text="'Visit: ' + ${r.visitDate} + ' • ' + ${r.doctorName}"></span>
                            <a th:href="@{/medical-records/{id}/edit(id=${r.id})}" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="text-muted small fw-semibold">Symptoms</div>
                            <p class="mb-0" th:text="${r.symptoms}"></p>
                        </div>
                        <div class="col-md-6">
                            <div class="text-muted small fw-semibold">Allergies</div>
                            <p class="mb-0 text-danger fw-medium" th:text="${r.allergies != null and !r.allergies.isEmpty() ? r.allergies : 'None reported'}"></p>
                        </div>
                        <div class="col-md-6">
                            <div class="text-muted small fw-semibold">Treatment Details</div>
                            <p class="mb-0" th:text="${r.treatmentDetails}"></p>
                        </div>
                        <div class="col-md-6">
                            <div class="text-muted small fw-semibold">Prescription</div>
                            <p class="mb-0" th:text="${r.prescription != null and !r.prescription.isEmpty() ? r.prescription : 'N/A'}"></p>
                        </div>
                        <div class="col-12" th:if="${r.notes != null and !r.notes.isEmpty()}">
                            <div class="text-muted small fw-semibold">Additional Notes</div>
                            <p class="mb-0 text-muted" th:text="${r.notes}"></p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
