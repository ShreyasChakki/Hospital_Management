# ==============================================================================
# Hospital Management System - Spring Boot Configuration
# ==============================================================================
spring.application.name=Hospital Management System
server.port=8080

# MySQL Database Configuration
# Override DB_USERNAME and DB_PASSWORD via environment variables in production.
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.tracking-modes=cookie

# Error Handling (never expose stack traces or internal DB details)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# Safe Default Admin Initialization (override via environment variables)
app.admin.default-username=${HMS_ADMIN_USERNAME:admin}
app.admin.default-password=${HMS_ADMIN_PASSWORD:Admin@123}
app.admin.default-fullname=Hospital Chief Administrator
app.admin.default-email=admin@hospitalcare.local

# Optional Demonstration Sample Data Seeding (set true for quick demo without SQL import)
app.demo-data.seed-on-startup=${HMS_SEED_DEMO_DATA:false}
